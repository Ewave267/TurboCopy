name: Linux build and prerelease

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools acl
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Check and test
        env:
          # Chunking tests need supported storage independent of the runner's disk type.
          TMPDIR: /dev/shm
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target "${{ matrix.target }}" -- -D warnings
          cargo test --locked --target "${{ matrix.target }}"
          python3 -m unittest discover -s tests -p 'test_publish_preview.py'
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir -p package dist
          cp "target/$TARGET/release/tcopy" README.md LICENSE package/
          tar -czf "dist/tcopy-linux-$ARCH.tar.gz" -C package tcopy README.md LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: tcopy-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tcopy-linux-*
          merge-multiple: true
          path: dist
      - name: Publish complete prerelease and retain only it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 tools/publish_preview.py
